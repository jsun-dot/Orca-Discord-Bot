[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-discord-bot"
version = "0.3.1"
description = "Discord music bot with hybrid slash and prefix commands, queue controls, Spotify playlist import, and moderation tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jaden Sun" }
]
keywords = ["discord", "discord-bot", "music-bot", "spotify", "yt-dlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "async-timeout>=4.0.3",
  "discord.py[voice]>=2.4.0,<3",
  "python-dotenv>=1.0.1",
  "pytz>=2024.1",
  "requests>=2.32.3",
  "spotipy>=2.24.0",
  "yt-dlp>=2026.1.31",
]

[project.urls]
Homepage = "https://github.com/jsun-dot/Orca-Discord-Bot"
Repository = "https://github.com/jsun-dot/Orca-Discord-Bot"
Issues = "https://github.com/jsun-dot/Orca-Discord-Bot/issues"

[project.scripts]
orca-bot = "orca_bot.bot:run"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["orca_bot.cogs.*", "orca_bot.utils.*"]
ignore_errors = true

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["orca_bot*"]
